<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyPeople | You need to see this</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#14123a;--cobalt:#2334ff;--pink:#ff5fa8;--sun:#ffd23f;--mint:#7cf0c1;--lilac:#e9e6ff;
--font:"Bricolage Grotesque","Arial Black",Impact,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--ink);font-family:var(--font);overflow:hidden}
.stage{position:relative;height:100%;overflow:hidden;cursor:pointer}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6vw;
 background:var(--bg);color:var(--fg);clip-path:circle(0% at var(--cx,50%) var(--cy,100%));
 transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
.scene.on{clip-path:circle(150% at var(--cx,50%) var(--cy,100%));z-index:2}
.scene.past{clip-path:circle(150% at 50% 50%);z-index:1}
h1,h2{margin:0;font-weight:800;font-size:clamp(3rem,11.5vw,10.5rem);line-height:.92;letter-spacing:-.045em;max-width:16ch}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-right:.22em}
.w>span{display:inline-block;transform:translateY(115%) rotate(6deg);transition:transform .8s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--i)*90ms + 450ms)}
.scene.on .w>span{transform:none}
.yes{position:absolute;right:6vw;bottom:5vh;font-weight:800;font-size:clamp(2rem,7vw,6rem);letter-spacing:-.04em;
 opacity:0;transform:scale(.4) rotate(-8deg);transition:.5s cubic-bezier(.3,1.6,.5,1)}
.scene.on.said .yes{opacity:1;transform:scale(1) rotate(-4deg)}
.q1{--bg:var(--cobalt);--fg:var(--lilac)}
.q2{--bg:var(--pink);--fg:var(--ink)}
.q3{--bg:var(--sun);--fg:var(--ink)}
.q4{--bg:var(--mint);--fg:var(--ink)}
.fin{--bg:var(--ink);--fg:#fff;--cx:50%;--cy:50%;padding-bottom:calc(6vw + 4rem)}
.fin h2{max-width:12ch}
.fin p{font-weight:500;font-size:clamp(1.05rem,2vw,1.5rem);max-width:34ch;margin:2rem 0 0;line-height:1.35;color:var(--lilac);
 opacity:0;transition:opacity .8s 1.6s}
.fin.on p,.fin.on .cta{opacity:1}
.cta{align-self:flex-start;margin-top:1.6rem;font:800 clamp(1rem,1.6vw,1.3rem)/1 var(--font);color:var(--ink);background:var(--sun);
 border:0;border-radius:999px;padding:1.1em 1.8em;cursor:pointer;text-decoration:none;opacity:0;transition:opacity .8s 2s,transform .2s}
.cta:hover{transform:scale(1.05) rotate(-1deg)}
.marq{position:absolute;left:0;right:0;bottom:0;overflow:hidden;white-space:nowrap;border-top:2px solid var(--cobalt);padding:1rem 0}
.marq div{display:inline-block;animation:slide 24s linear infinite;font-weight:800;font-size:clamp(1.2rem,2.4vw,2rem);letter-spacing:-.02em;color:var(--pink)}
.marq span{margin-right:2.5rem}
@keyframes slide{to{transform:translateX(-50%)}}
.dots{position:absolute;left:6vw;top:calc(3vh + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:.6rem}
.dots button{width:2.2rem;height:.45rem;border:0;border-radius:9px;background:currentColor;opacity:.3;padding:0;cursor:pointer;color:#fff;mix-blend-mode:difference}
.dots button.on{opacity:1}
.skip{position:absolute;right:6vw;top:calc(2.4vh + env(safe-area-inset-top,0px));z-index:5;font:500 1rem var(--font);border:0;background:none;color:#fff;mix-blend-mode:difference;cursor:pointer;text-decoration:underline}
.hint{position:absolute;left:6vw;bottom:calc(3vh + env(safe-area-inset-bottom,0px));z-index:5;font:500 .95rem var(--font);color:#fff;mix-blend-mode:difference}
.stage.done .hint{display:none}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){
 body{overflow:auto;height:auto}.stage{height:auto;cursor:auto}
 .scene{position:relative;min-height:70vh;clip-path:none;transition:none}
 .w>span,.yes,.fin p,.cta{transform:none;opacity:1;transition:none}
 .marq div{animation:none}.dots,.skip,.hint{display:none}.fin{min-height:100vh}
}
</style>
</head>
<body>
<main class="stage" id="stage">
 <div class="dots" id="dots" role="tablist" aria-label="Questions"></div>
 <button class="skip" id="skip">Skip to the good part</button>

 <section class="scene q1" style="--cx:50%;--cy:100%"><h1 data-t="Do you want your customers to feel connected to you?"></h1><div class="yes" aria-hidden="true">Yes.</div></section>
 <section class="scene q2" style="--cx:0%;--cy:50%"><h1 data-t="Do you want your employees to be more engaged?"></h1><div class="yes" aria-hidden="true">Yes.</div></section>
 <section class="scene q3" style="--cx:100%;--cy:0%"><h1 data-t="Do you want to own your audience, not rent it?"></h1><div class="yes" aria-hidden="true">Yes.</div></section>
 <section class="scene q4" style="--cx:50%;--cy:0%"><h1 data-t="Do you want to know what your community really thinks?"></h1><div class="yes" aria-hidden="true">Yes.</div></section>

 <section class="scene fin">
  <h2 data-t="You need to see MyPeople."></h2>
  <p>The trusted people engagement platform, built by the team behind HR's largest online community.</p>
  <a class="cta" href="#book">Book 30-Minute Discovery Call</a>
  <div class="marq" aria-hidden="true"><div id="mq"></div></div>
 </section>
 <div class="hint">Click, tap or press space to move on</div>
</main>

<script>
(function(){
  var scenes=[].slice.call(document.querySelectorAll('.scene')),
      dotsEl=document.getElementById('dots'),stage=document.getElementById('stage'),
      cur=-1,timer,said;
  // split headlines into animated words
  document.querySelectorAll('[data-t]').forEach(function(h){
    h.setAttribute('aria-label',h.dataset.t);
    h.innerHTML=h.dataset.t.split(' ').map(function(w,i){
      return '<span class="w" aria-hidden="true" style="--i:'+i+'"><span>'+w+'</span></span>';}).join('');
  });
  // marquee
  var items=['Customers who feel connected','Employees who stay','Your brand','Your data','Your community'];
  var m=items.concat(items).map(function(t){return '<span>'+t+'</span>';}).join('');
  document.getElementById('mq').innerHTML=m+m;
  // dots
  scenes.forEach(function(_,i){
    var b=document.createElement('button');b.setAttribute('aria-label','Go to scene '+(i+1));
    b.addEventListener('click',function(e){e.stopPropagation();go(i);});dotsEl.appendChild(b);
  });
  function go(n){
    if(n<0||n>=scenes.length||n===cur)return;
    clearTimeout(timer);clearTimeout(said);
    scenes.forEach(function(s,i){
      s.classList.remove('on','said');
      s.classList.toggle('past',i<n);
    });
    cur=n;scenes[n].classList.add('on');
    [].forEach.call(dotsEl.children,function(d,i){d.classList.toggle('on',i===n);});
    stage.classList.toggle('done',n===scenes.length-1);
    if(n<scenes.length-1){
      said=setTimeout(function(){scenes[n].classList.add('said');},2600);
      timer=setTimeout(function(){go(n+1);},4400);
    }
  }
  stage.addEventListener('click',function(e){if(e.target.closest('a,button'))return;go(cur+1);});
  document.getElementById('skip').addEventListener('click',function(e){e.stopPropagation();go(scenes.length-1);});
  document.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();go(cur+1);}
    if(e.key==='ArrowLeft')go(cur-1);
  });
  if(!window.matchMedia('(prefers-reduced-motion:reduce)').matches)setTimeout(function(){go(0);},200);
})();
</script>
</body>
</html>
